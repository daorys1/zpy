[Keywords]
# Zpy Keyword Mappings
#
# This file maps Chinese characters to Python keywords.
# The selection is based on the primary keyword table in `notes/keywords.md`
# for consistency and clarity.

# Boolean and Null Values
假 = False
空 = None
真 = True

# Logical Operators
与 = and
或 = or
非 = not

# Conditional Statements
如果 = if
否则如果 = elif
否则 = else

# Loops
循环 = for
当 = while
中断 = break
继续 = continue

# Function and Class Definition
定义 = def
类 = class
返回 = return
产出 = yield
匿名 = lambda

# Exception Handling
尝试 = try
异常 = except
最终 = finally
抛出 = raise

# Context Management
与...一起 = with
作为 = as

# Imports
导入 = import
从 = from

# Scope
全局 = global
非局部 = nonlocal

# Operators
在 = in
是 = is

# Statements
断言 = assert
删除 = del
跳过 = pass
